
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .container { text-align: center; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; margin: 20px 0; justify-content: center; }
        .cell { width: 100px; height: 100px; background: rgba(255,255,255,0.2); border: none; font-size: 2rem; color: white; cursor: pointer; border-radius: 10px; transition: all 0.2s; }
        .cell:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .cell.x { color: #ff6b6b; }
        .cell.o { color: #4ecdc4; }
        .winner { background: rgba(255,255,255,0.5) !important; }
        button { padding: 10px 20px; background: linear-gradient(45deg, #ff6b6b, #4ecdc4); border: none; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; margin: 10px; }
        button:hover { transform: scale(1.05); }
        .status { font-size: 1.2rem; margin: 15px 0; min-height: 30px; }
        .mode { margin: 10px 0; }
        .mode button.active { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic-Tac-Toe</h1>
        <div class="mode">
            <button onclick="setMode('human')" class="active" id="humanBtn">👥 vs Human</button>
            <button onclick="setMode('ai')" id="aiBtn">🤖 vs AI</button>
        </div>
        <div class="status" id="status">Player X's Turn</div>
        <div class="board" id="board"></div>
        <button onclick="reset()">🔄 New Game</button>
        <div>X: <span id="scoreX">0</span> | Draw: <span id="scoreDraw">0</span> | O: <span id="scoreO">0</span></div>
    </div>

    <script>
        let board = Array(9).fill(''), player = 'X', mode = 'human', active = true, scores = {X:0, O:0, draw:0};
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const status = document.getElementById('status');

        function createBoard() {
            document.getElementById('board').innerHTML = board.map((cell, i) => 
                `<button class="cell ${cell.toLowerCase()}" onclick="move(${i})">${cell}</button>`
            ).join('');
        }

        function move(i) {
            if (board[i] || !active) return;
            board[i] = player;
            if (checkWin()) return;
            player = player === 'X' ? 'O' : 'X';
            updateStatus();
            createBoard();
            if (mode === 'ai' && player === 'O' && active) setTimeout(aiMove, 300);
        }

        function checkWin() {
            const winner = wins.find(combo => combo.every(i => board[i] && board[i] === board[combo[0]]));
            if (winner) {
                active = false;
                status.textContent = `🎉 Player ${board[winner[0]]} Wins!`;
                winner.forEach(i => document.querySelectorAll('.cell')[i]?.classList.add('winner'));
                scores[board[winner[0]]]++;
                updateScore();
                return true;
            }
            if (board.every(cell => cell)) {
                active = false;
                status.textContent = '🤝 Draw!';
                scores.draw++;
                updateScore();
                return true;
            }
            return false;
        }

        function aiMove() {
            const bestMove = minimax(board, true).index;
            if (bestMove !== undefined) move(bestMove);
        }

        function minimax(newBoard, isMaximizing, depth = 0) {
            const winner = wins.find(combo => combo.every(i => newBoard[i] && newBoard[i] === newBoard[combo[0]]));
            if (winner) return { score: newBoard[winner[0]] === 'O' ? 10 - depth : depth - 10 };
            if (newBoard.every(cell => cell)) return { score: 0 };

            const moves = [];
            newBoard.forEach((cell, i) => {
                if (!cell) {
                    const move = { index: i };
                    newBoard[i] = isMaximizing ? 'O' : 'X';
                    move.score = minimax(newBoard, !isMaximizing, depth + 1).score;
                    newBoard[i] = '';
                    moves.push(move);
                }
            });

            return isMaximizing ? 
                moves.reduce((best, move) => move.score > best.score ? move : best) :
                moves.reduce((best, move) => move.score < best.score ? move : best);
        }

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(newMode + 'Btn').classList.add('active');
            reset();
        }

        function updateStatus() {
            if (!active) return;
            status.textContent = mode === 'ai' && player === 'O' ? '🤖 AI Thinking...' : `Player ${player}'s Turn`;
        }

        function updateScore() {
            Object.keys(scores).forEach(key => 
                document.getElementById('score' + (key === 'draw' ? 'Draw' : key)).textContent = scores[key]
            );
        }

        function reset() {
            board = Array(9).fill('');
            player = 'X';
            active = true;
            updateStatus();
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
